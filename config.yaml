# ============================================================
# 涨停预测策略 V1 — 配置文件
# 所有参数集中在这里，改参数不用改代码
# ============================================================

# Tushare 配置（token 从 .env 读取，不写在这里）
tushare:
  api_url: "https://api.tushare.pro"

# 回测时间范围
backtest:
  start_date: "20200101"
  end_date: "20260804"

# 因子列表（搭档在这里添加新因子名称即可）
# 当前只有 MA5 和 MA10，搭档可以继续加
factors:
  - ma5
  - ma10

# 多元线性回归模型参数
model:
  # 训练/测试集划分比例
  train_ratio: 0.8
  # 预测概率阈值：预测值 > 此阈值视为"预测涨停"
  predict_threshold: 0.5

# 交易规则
trading:
  # 初始资金
  initial_capital: 1000000
  # 每次买入仓位比例（总资金的多少）
  position_size: 0.1
  # 最大持仓天数
  max_holding_days: 5
  # 止损比例（亏损达此比例卖出）
  stop_loss: -0.05
  # 止盈比例（盈利达此比例卖出）
  take_profit: 0.10

# 日志
logging:
  level: "INFO"
