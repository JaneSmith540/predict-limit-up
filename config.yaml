# ============================================================
# 涨停预测策略 V1 — 滚动重训版 (Round 3: 分散持仓)
# ============================================================

tushare:
  api_url: "https://api.tushare.pro"

backtest:
  start_date: "20250801"
  end_date: "20260804"
  train_start_date: "20240101"
  daily_pick: 3
  max_positions: 3
  warmup_days: 30

vnpy:
  rate: 0.0003
  slippage: 0.0
  size: 1.0
  pricetick: 0.01
  risk_free: 0.0
  annual_days: 240

factors:
  - momentum_5
  - momentum_10
  - ma5_bias
  - ma10_bias
  - volatility_5
  - break_high_10
  - rsi_14

model:
  train_ratio: 0.8
  label_threshold: 2.0
  predict_threshold: 0.40
  exit_threshold: 0.0

  weights:
    catboost: 1.0
    lightgbm: 1.0
    xgboost: 1.0

  catboost:
    iterations: 500
    depth: 6
    learning_rate: 0.05

  lightgbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05

  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05

trading:
  initial_capital: 1000000
  position_size: 0.33
  max_holding_days: 3
  stop_loss: -0.04
  take_profit: 0.10
  market_filter: false
  market_ma: 10

logging:
  level: "INFO"
