# ============================================================
# 涨停预测策略 V2.0 — 全局参数配置
# 所有阈值、权重、百分比集中于此，代码中禁止 hardcode
# 修改参数只需改本文件，无需改动代码逻辑
# ============================================================

# ============================================================
# 1. NFRM 多因子共振涨停预测模型
# ============================================================
nfrm:
  # 五维权重（合计 100%）
  weights:
    information: 0.25   # 信息面 25%
    capital: 0.25        # 资金面 25%
    technical: 0.20      # 技术面 20%
    chip: 0.15           # 筹码面 15%
    market: 0.15         # 市场面 15%

  # 总分映射涨停概率
  score_mapping:
    S_plus: { min_score: 85, probability: 0.70, label: "S+" }
    S:      { min_score: 75, probability: 0.55, label: "S" }
    A_plus: { min_score: 65, probability: 0.45, label: "A+" }
    A:      { min_score: 55, probability: 0.35, label: "A" }
    B:      { min_score: 45, probability: 0.25, label: "B" }
    C:      { min_score: 0,  probability: 0.00, label: "C" }

  # 非线性放大效应: 五维均 >= 70 分时，涨停概率非线性跃升
  nonlinear_amplify:
    enabled: true
    all_dims_threshold: 70
    probability_boost: 0.15   # 概率额外提升 15%

  # --- 信息面子项评分细则 (1.4.1) ---
  information_factors:
    announcement_level:
      major_positive: 100      # 重大利好（业绩预增>50%/并购重组/政策利好）
      moderate_positive: 80    # 中等利好（业绩预增20-50%/产品涨价）
      minor_positive: 60       # 小幅利好（业绩预增<20%/常规回购）
      neutral: 50              # 无明显利好
      negative: 20             # 利空
    policy_catalyst:
      national_level: 100      # 国家级政策
      ministerial_level: 80    # 部委级政策
      local_level: 60          # 地方政策
    news_heat:
      high: 100                # 舆情指数高位（百度指数>90分位）
      medium: 70
      low: 40
    us_market_mapping:
      strong_mapping: 90       # 美股映射强（对应标的涨幅>5%）
      medium_mapping: 60
      weak_mapping: 30

  # --- 资金面子项评分细则 (1.4.2) ---
  capital_factors:
    main_net_inflow:
      strong: 100               # 主力净流入排名前5%
      medium_strong: 80         # 前5-15%
      medium: 60                # 前15-30%
      weak: 30
    north_fund:
      strong_buy: 100           # 北向资金净买入>1亿
      medium_buy: 70
      sell: 20
    large_order_ratio:
      high: 100                 # 大单成交占比>15%
      medium: 70                # 8-15%
      low: 40
    limit_up_fund:
      strong: 100               # 封单>1亿
      medium: 70                # 3000万-1亿
      weak: 30                  # <3000万

  # --- 技术面子项评分细则 (1.4.3) ---
  technical_factors:
    volume_price:
      perfect_resonance: 100    # 放量涨停（量比>2，涨幅>9%）
      strong: 80                # 放量大涨（量比1.5-2，涨幅5-9%）
      medium: 60
      weak: 30
    ma_system:
     多头排列: 100              # 5/10/20/60日均线多头排列
      partial: 70
      bearish: 30
    macd_signal:
      golden_cross: 100         # MACD金叉且红柱放大
      above_zero: 80
      below_zero: 40
    pattern:
      breakout: 100             # 突破平台/箱体/前高
      flag: 80                  # 旗形整理后突破
      none: 50

  # --- 筹码面子项评分细则 (1.4.4) ---
  chip_factors:
    concentration:
      high: 100                 # 90%集中度>80%（筹码高度集中）
      medium: 70                 # 60-80%
      low: 40
    trapped_ratio:
      low: 100                  # 上方套牢盘<10%
      medium: 60                 # 10-30%
      high: 20                   # >30%
    holder_change:
      decreasing: 100           # 股东户数环比下降>5%（筹码集中）
      stable: 60
      increasing: 30            # 筹码分散

  # --- 市场面面子项评分细则 (1.4.5) ---
  market_factors:
    sector_resonance:
      strong: 100               # 板块涨幅>3%，3只以上涨停
      medium: 70                # 板块涨幅1-3%
      weak: 30
    market_env:
      bull: 100                 # 沪深300在60日均线上方且涨幅>0
      shock: 60
      bear: 20
    sentiment:
      high: 100                 # 涨停家数>50，跌停<10
      medium: 60
      low: 20                   # 跌停>涨停

# ============================================================
# 2. LGM 涨停基因模型
# ============================================================
lgm:
  # 五个子项权重
  weights:
    limit_up_count: 0.30        # 涨停次数 30%
    consecutive_rate: 0.25      # 连板率 25%
    seal_success_rate: 0.20     # 封板成功率 20%
    activity: 0.15              # 股性活跃度 15%
    amplitude: 0.10             # 振幅 10%

  # 评分标准
  scoring:
    limit_up_count:
      lookback_days: 180
      full_score_threshold: 5   # 近180日涨停>=5次为满分100
      per_count_score: 20       # 每次涨停20分
    consecutive_rate:
      full_score_threshold: 0.60  # 连板率>60%为满分
    seal_success_rate:
      full_score_threshold: 0.80  # 封板成功率>80%为满分
    activity:
      turnover_rate_min: 0.05    # 20日平均换手率5%
      turnover_rate_max: 0.15    # 20日平均换手率15%（此区间为满分）
    amplitude:
      amp_min: 0.04             # 20日平均振幅4%
      amp_max: 0.08             # 20日平均振幅8%（此区间为满分）

# ============================================================
# 3. AHS 竞价健康度评分
# ============================================================
ahs:
  # 四个子项权重
  weights:
    auction_gain: 0.30          # 竞价涨幅 30%
    volume_ratio: 0.30          # 竞价量能比 30%
    order_ratio: 0.20           # 委托比 20%
    price_drift: 0.20           # 价格漂移 20%

  # 竞价涨幅评分
  auction_gain_scoring:
    perfect: { min: 0.03, max: 0.05, score: 100 }   # 3%-5% 满分
    good:    { min: 0.05, max: 0.07, score: 80 }    # 5%-7% 80分
    fair:    { min: 0.07, max: 0.09, score: 60 }    # 7%-9% 60分
    weak:    { min: 0.00, max: 0.03, score: 40 }    # <3% 40分
    too_high: { min: 0.09, max: 1.00, score: 20 }   # >9% 20分

  # 竞价量能比评分 (竞价成交量/昨日全天成交量)
  volume_ratio_scoring:
    perfect: { min: 0.08, max: 0.15, score: 100 }
    good:    { min: 0.05, max: 0.08, score: 80 }
    good2:   { min: 0.15, max: 0.20, score: 80 }
    weak:    { min: 0.00, max: 0.05, score: 40 }
    too_high: { min: 0.20, max: 1.00, score: 60 }

  # 委托比评分 (买盘委托量/卖盘委托量)
  order_ratio_scoring:
    excellent: { min: 5.0, max: 999, score: 100 }
    good:      { min: 3.0, max: 5.0, score: 90 }
    fair:      { min: 2.0, max: 3.0, score: 80 }
    weak:      { min: 1.0, max: 2.0, score: 60 }
    poor:      { min: 0.0, max: 1.0, score: 20 }

  # 价格漂移评分 (9:20-9:25价格走势)
  price_drift_scoring:
    upward: 100     # 持续上移
    sideways: 70    # 横盘
    downward: 30    # 下移

# ============================================================
# 4. 信号分级与仓位 (基于凯利公式)
# ============================================================
signal_levels:
  S_plus:
    conditions:
      nfrm_min: 85
      ahs_min: 80
      lgm_min: 70
      all_dims_min: 70        # 五维均>70
    max_position_pct: 0.15    # 单票仓位上限15%
    win_probability: 0.70
  S:
    conditions:
      nfrm_min: 75
      ahs_min: 70
      lgm_min: 60
    max_position_pct: 0.12
    win_probability: 0.55
  A_plus:
    conditions:
      nfrm_min: 65
      ahs_min: 60
      sector_confirm: true     # 需板块共振确认
    max_position_pct: 0.08
    win_probability: 0.45
  A:
    conditions:
      nfrm_min: 55
      ahs_min: 50
      single_dim_outstanding: true
    max_position_pct: 0.05
    win_probability: 0.35
  B:
    conditions:
      nfrm_min: 45
    max_position_pct: 0.03
    win_probability: 0.25
  C:
    conditions:
      nfrm_min: 0
    max_position_pct: 0.00     # 不参与
    win_probability: 0.00

# ============================================================
# 5. 建仓节奏 (分五阶段)
# ============================================================
entry_phases:
  # 阶段1: 研究建仓 (T-1尾盘) - 仅观察
  research:
    position_pct: 0.00
    action: "observe"

  # 阶段2: 竞价挂单 (T日9:25后)
  auction_order:
    position_pct_min: 0.05      # 仓位5%-8%
    position_pct_max: 0.08
    # 挂单价 = min(开盘价*1.02, 涨停价*0.99)
    order_price_open_multiplier: 1.02
    order_price_limit_multiplier: 0.99
    # 预计秒板标的直接挂涨停价排队
    seal_fund_min: 5000000       # 封单<500万则放弃
    cancel_minutes: 1            # 开盘后1分钟内未成交且价格回落则撤单

  # 阶段3: 开盘加仓 (9:30-9:35)
  open_add:
    position_pct_min: 0.05      # 仓位5%-7%
    position_pct_max: 0.07
    require_seal_confirm: true   # 需满足秒板确认信号

  # 阶段4: 回封加仓 (盘中炸板后缩量回封)
  re_seal_add:
    position_pct_min: 0.03      # 仓位3%-5%
    position_pct_max: 0.05

  # 阶段5: 预留现金
  cash_reserve:
    min_pct: 0.10               # 始终保留10%-15%
    max_pct: 0.15

# ============================================================
# 6. 开盘秒板确认信号 (满足4项及以上才加仓)
# ============================================================
seal_confirm_signals:
  required_count: 4              # 需满足至少4项
  conditions:
    min_gain_1min: 0.05         # 1. 开盘1分钟内涨幅>=5%
    first_volume_ratio: 0.30     # 2. 首笔成交量>昨日均量30%
    avg_volume_mult: 2.0        # 3. 每笔均量较昨日放大2倍以上
    sector_sync_count: 2        # 4. 同板块至少2只同步拉升且涨幅>3%
    sector_sync_gain: 0.03
    buy_queue_amount: 10000000  # 5. 买一队列厚度>1000万元
    slope_angle: 60             # 6. 拉升斜率>60度且无显著回调

  # 弱势信号 (满足1项即放弃)
  weak_signals:
    low_open: true               # 低开/平开
    high_open_drop: true         # 高开后迅速跌破开盘价
    first_volume_shrink: true    # 首笔缩量
    sector_alone: true           # 板块独行
    market_drop: 0.005           # 大盘跳水超0.5%

# ============================================================
# 7. 出场规则
# ============================================================
exit_rules:
  # --- 事件驱动止盈 ---
  event_driven:
    sealed_to_close: { action: "hold_next_day" }           # 成功封板至收盘→持有至次日
    next_day_high_open: { threshold: 0.03, action: "hold_watch" }  # 次日竞价高开>3%→持有观察
    next_day_low_open: { threshold: -0.02, action: "auction_sell_all" }  # 次日竞价低开>2%→清仓
    unseal_30min: { action: "sell_all" }                    # 炸板后30分钟未回封→清仓
    sector_leader_break: { action: "reduce_half" }          # 同板块龙头断板或跌停→减仓50%
    exchange_monitor: { action: "sell_all" }                 # 交易所重点监控或特停→清仓

  # --- 技术性止盈 ---
  technical:
    next_day_gain_7pct: { sell_pct: 0.50, move_stop_to: 0.05 }  # 次日竞价涨幅>7%→卖出50%,止损推至+5%
    profit_15pct: { sell_pct: 0.50 }                             # 持仓浮盈达15%→卖出50%
    seal_fund_drop: { threshold: 0.50, action: "sell_all" }      # 封单量骤降>50%→清仓
    sector_follower_limit_down: { action: "sell_leader" }       # 板块内跟风股跌停→清仓龙头

  # --- 止损体系 (7层) ---
  stop_loss:
    L1_auction:
      trigger: { next_day_low_open: -0.02 }                    # 次日竞价低开>2%
      action: "auction_sell_limit_down_price"
    L2_open:
      trigger: { within_minutes: 5, below_prev_close: true }    # 开盘后5分钟内跌破昨日收盘价
      action: "sell_all_now"
    L3_technical:
      trigger: { below_prev_limit_up: true, below_ma5: true }  # 跌破昨日涨停价或5日均线
      action: "sell_all"
    L4_unseal:
      trigger: { unseal_and_drop: true, no_reseal: true }      # 炸板后直线下杀不回封
      action: "sell_at_limit_down"
    L5_drawdown:
      trigger: { max_loss_pct: -0.05 }                          # 持仓浮亏达5%
      action: "sell_all_unconditional"
    L6_market:
      trigger: { hs300_below_ma60: true, drop_pct: -0.03 }      # 沪深300跌破60日均线且跌幅>3%
      action: "sell_all_positions"

# ============================================================
# 8. 一票否决清单 (14项)
# ============================================================
veto_list:
  - id: 1
    name: "NFRM过低"
    condition: "nfrm_score < 45"
  - id: 2
    name: "AHS过低"
    condition: "ahs_score < 50"
  - id: 3
    name: "竞价涨幅异常"
    condition: "auction_gain > 0.09 or auction_gain < 0.02"
  - id: 4
    name: "流通市值过大"
    condition: "float_market_cap > 30000000000"   # >300亿
  - id: 5
    name: "近期大额解禁"
    condition: "unlock_amount_ratio > 0.05 within 30 days"  # >流通盘5%
  - id: 6
    name: "财务非标/监管函"
    condition: "financial_irregularity or warning_letter within 90 days"
  - id: 7
    name: "大股东减持"
    condition: "major_shareholder_reducing within 6 months"
  - id: 8
    name: "尾盘偷袭板"
    condition: "sealed_after_1430 and seal_fund_weak"
  - id: 9
    name: "连续上涨后利好"
    condition: "cumulative_gain > 0.50 before positive_news"
  - id: 10
    name: "板块退潮"
    condition: "sector_low_open_ratio > 0.60"    # 昨日涨停今日低开率>60%
  - id: 11
    name: "大盘系统性风险"
    condition: "hs300_weekly_drop < -0.05"       # 沪深300周跌幅>5%
  - id: 12
    name: "竞价诱多"
    condition: "price_declining_after_0920"
  - id: 13
    name: "庄股特征"
    condition: "fishing_line_pattern or matched_trading"
  - id: 14
    name: "无板块效应"
    condition: "no_sector_high_open_stocks"

# ============================================================
# 9. 风控规则
# ============================================================
risk_control:
  # 仓位限制
  single_stock_max_pct: 0.15           # 单票仓位上限15%
  daily_build_max_pct: 0.25            # 单日建仓上限25%
  sector_concentration_max: 0.30       # 单一板块≤30%

  # 大盘熔断
  market_circuit_breaker:
    hs300_drop_threshold: -0.03        # 沪深300跌超3%→清仓所有
    check_frequency_seconds: 60        # 每分钟检查

  # T+1约束
  t_plus_1: true                        # 当日买入次日才可卖出

  # 黑名单管理
  blacklist:
    stop_loss_count: 2                 # 连续2次止损
    suspend_days: 5                    # 暂停5日
    storage: "sqlite"                  # 持久化存储方式

  # 撤单频率
  max_cancel_count_per_day: 50         # 单日撤单不超过50次

  # 持仓管理 (用户偏好)
  portfolio:
    max_concurrent_positions: 3        # 最多同时持有3只
    max_holding_days: 5                # 最大持有天数5天
    entry_method: "open_price"          # 入场方式: 开盘价 (未来升级 intraday)

# ============================================================
# 10. 数据源配置
# ============================================================
data_source:
  tushare:
    # token 从 .env 环境变量读取, 不写入此文件
    token_env_var: "TUSHARE_TOKEN"
    api_url: "https://api.tushare.pro"
    # 接口调用频率限制 (次/分钟)
    rate_limit:
      default: 200
      daily_basic: 500
      limit_list_d: 400

  # 回测数据时间范围
  backtest:
    start_date: "2020-01-01"
    end_date: "2026-08-04"

  # 数据缓存
  cache:
    enabled: true
    type: "sqlite"
    path: "data_cache/limitup.db"

# ============================================================
# 11. 扫描模块时间窗口
# ============================================================
scan_schedule:
  tail_scan:
    start: "14:30"
    end: "15:00"
    description: "尾盘异动扫描"
  overnight_scan:
    start: "20:00"
    end: "09:15"
    description: "隔夜信息扫描"
  auction_monitor:
    start: "09:15"
    end: "09:25"
    description: "竞价信号确认"
  open_confirm:
    start: "09:30"
    end: "09:35"
    description: "开盘确认锁定"

  # 初选池规模
  initial_pool_size:
    min: 50
    max: 100
  # 信号池规模
  signal_pool_size:
    min: 5
    max: 10
  # 最终标的
  final_target_size:
    min: 1
    max: 3

# ============================================================
# 12. 日志配置
# ============================================================
logging:
  level: "INFO"                        # DEBUG / INFO / WARNING / ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: | <8} | {name}:{function}:{line} - {message}"
  rotation: "00:00"                    # 每日轮转
  retention: "30 days"                # 保留30天
  path: "logs"
  # 交易日志单独记录
  trade_log:
    enabled: true
    path: "logs/trades"
    fields: ["datetime", "code", "name", "action", "price", "volume", "signal_level", "reason"]
